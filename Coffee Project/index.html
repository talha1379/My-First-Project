<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Coffee Website</title>
  </head>
  <body>
    <!-- Header / Navbar -->
    <header>
      <nav class="navbar section-content">
        <a href="#" class="nav-logo">
          <h2 class="logo-text">Coffee</h2>
        </a>
        <ul class="nav-manu">
          <li class="nav-item">
            <a href="#" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">About</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Manu</a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Testimonils</a>
          </li>
          <li class="nav-item">

          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">Contact</a>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <!-- Hero Section -->
      <section class="hero-section">
        <div class="section-content">
          <div class="hero-details">
            <h2 class="title">Best Coffee</h2>
            <h3 class="subtitle">
              Make Your Day Grate With Our Special Coffee!
            </h3>
            <p class="descriptiion">
              Welcome to our coffee paradise, where every bean tells a story and
              every cup sparks joy.
            </p>
            <div class="buttons">
              <a href="#" class="button order-now">Order Now</a>
              <a href="#" class="button contact-now">Contact Us</a>
            </div>
          </div>
          <div class="hero-image-wrapper">
            <img src="pic 1.jpg" alt="hero" class="hero-image" />
          </div>
        </div>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
