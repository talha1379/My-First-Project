<!doctype html>
<html>
  <head>
    <title>Simple Table</title>
  </head>
  <body>
    <h2>Student Table</h2>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Class</th>
        <th>Marks</th>
      </tr>
      <tr>
        <td>Ali</td>
        <td>BSCS</td>
        <td>85</td>
      </tr>

      <tr>
        <td>Ahmed</td>
        <td>BSIT</td>
        <td>90</td>
      </tr>
      <tr>
        <td>Sara</td>
        <td>BBA</td>
        <td>88</td>
      </tr>
    </table>
  </body>
</html>
