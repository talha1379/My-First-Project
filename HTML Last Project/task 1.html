<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ART PAGE</title>

    <style>
         body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #fbecec;
            
        }

        header {
            background-color: #3c1616;
            color: rgb(255, 255, 255);
            padding: 20px;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .art-card {
            background-color: rgb(156, 122, 122);
            color: #fbecec;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(239, 237, 237, 0.1);
            transition: transform 0.3s;
        }

        .art-card:hover {
            transform: scale(1.03);
        }

        .art-info {
            padding: 15px;
        }


        .artist {
            font-weight: bold;
            color: #666;
            margin-bottom: 8px;
        }

    </style>
  </head>
  <body>
    <header>
      <h1>This is Art</h1>
      <p>This is made for Art page</p>
    </header>

    <br>

    <section class="galery">
      <div class="art-card">
        
        <div class="art-info">
            <h3>Sunset Dreams</h3>
            <div class="artist">Artist: Ayesha Khan<div>
            <p>A vibrant painting capturing the calm beauty of a sunset.</p>
        </div>
    </div>        
      </div>
    </section>
  </body>
</html>
